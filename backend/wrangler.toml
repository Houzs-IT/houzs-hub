name = "houzs-it-hub"
# Hello@houzscentury.com's Account. Pinned so a deploy from a machine signed in
# to another Cloudflare account fails instead of landing there.
account_id = "816e457307d7fa0491c2a08a72ad5dcd"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Serve on the custom domain only.
workers_dev = false
routes = [{ pattern = "support.houzscentury.com", custom_domain = true }]

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secret (not a var): SESSION_SECRET, set with `wrangler secret put SESSION_SECRET`.

# Supabase Postgres, reached through Hyperdrive. The connection string (with the
# database password) lives in the Hyperdrive config in Cloudflare, not here.
# localConnectionString is the throwaway Postgres from the README, for wrangler dev.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "HYPERDRIVE_ID_PENDING"
localConnectionString = "postgres://postgres:postgres@127.0.0.1:54329/postgres"

[[r2_buckets]]
binding = "FILES"
bucket_name = "houzs-it-hub"

[triggers]
# 02:00 UTC = 10:00 GMT+8. Auto-closes tickets left in Resolved for 7 days.
crons = ["0 2 * * *"]

[observability]
[observability.logs]
enabled = true
