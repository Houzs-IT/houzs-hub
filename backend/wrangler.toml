name = "houzs-it-hub"
# Hello@houzscentury.com's Account. Pinned so a deploy from a machine signed in
# to another Cloudflare account fails instead of landing there.
account_id = "816e457307d7fa0491c2a08a72ad5dcd"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Serve on the custom domain only.
workers_dev = false
routes = [{ pattern = "support.houzscentury.com", custom_domain = true }]

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /.well-known: the AI Connector's OAuth discovery (routes/mcp.ts).
run_worker_first = ["/api/*", "/.well-known/*"]

# Secret (not a var): SESSION_SECRET, set with `wrangler secret put SESSION_SECRET`.

# Supabase Postgres, reached through Hyperdrive. The connection string (with the
# database password) lives in the Hyperdrive config in Cloudflare, not here.
# Query caching is switched off on that config: a ticket read straight after a
# write must not come back stale.
# localConnectionString is the throwaway Postgres from the README, for wrangler dev.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "b69ab87887944295afe3f39134e6434d"
localConnectionString = "postgres://postgres:postgres@127.0.0.1:54329/postgres"

# Health alert emails (src/services/healthAlerts.ts). They go out once the secret
# RESEND_API_KEY is set: `wrangler secret put RESEND_API_KEY`.
[vars]
HEALTH_ALERT_TO = "it@houzscentury.com"
HEALTH_ALERT_FROM = "Houzs IT Hub <no-reply@houzscentury.com>"
# AI Connector round 4d (routes/proactive.ts, routes/groupReport.ts): the hub's public address
# (email links, the group report's OAuth return address) and the sender of the morning brief,
# alert and group report emails. They go out through Resend once RESEND_API_KEY is set.
# The group report also needs the secret GROUP_REPORT_KEY (any long random string; it encrypts
# the systems' sign-in tokens): `wrangler secret put GROUP_REPORT_KEY`.
HUB_ORIGIN = "https://support.houzscentury.com"
BRIEF_MAIL_FROM = "Houzs IT Hub <no-reply@houzscentury.com>"
# Meetings: the Houzs account every Google Meet link is created as (services/googleMeet.ts).
GOOGLE_MEET_OWNER = "hello@houzscentury.com"
# Meetings: emails go out from this address; the button in each email opens the person's own ERP.
MEETING_MAIL_FROM = "Houzs Meetings <hello@houzscentury.com>"
MEETING_MAIL_FROM_BY_SYSTEM = '{"HC":"Houzs Meetings <hello@houzscentury.com>","IT":"Houzs Meetings <hello@houzscentury.com>","HR":"Houzs Meetings <hello@houzscentury.com>","HK":"Hookka Meetings <hello@hookka.com>","CARRES":"Carres Meetings <hello@carresofficial.com>","CONTS":"The Conts Meetings <hello@theconts.com>"}'
MEETING_ERP_URLS = '{"HC":"https://erp.houzscentury.com","HK":"https://erp.hookka.com","CARRES":"https://erp.carresofficial.com","CONTS":"https://erp.theconts.com","IT":"https://support.houzscentury.com","HR":"https://hris.houzscentury.com"}'

[[r2_buckets]]
binding = "FILES"
bucket_name = "houzs-it-hub"

# New-ticket alerts to open hub tabs (src/live.ts).
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

[triggers]
# Every 5 minutes: system health checks. The ticket auto-close (tickets left in
# Resolved for 7 days) runs inside the 02:00 UTC = 10:00 GMT+8 one only; see index.ts.
crons = ["*/5 * * * *"]

[observability]
[observability.logs]
enabled = true
