name = "houzs-it-hub"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Serve on the custom domain only.
workers_dev = false

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Secret (not a var): SESSION_SECRET, set with `wrangler secret put SESSION_SECRET`.

[[d1_databases]]
binding = "DB"
database_name = "houzs-it-hub"
database_id = "4b7d5586-11b5-4756-ad6c-2ca256a08c88"

[[r2_buckets]]
binding = "FILES"
bucket_name = "houzs-it-hub"

[triggers]
# 02:00 UTC = 10:00 GMT+8. Auto-closes tickets left in Resolved for 7 days.
crons = ["0 2 * * *"]

[observability]
[observability.logs]
enabled = true
