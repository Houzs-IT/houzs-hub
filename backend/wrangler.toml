name = "houzs-it-hub"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Access only protects the custom domain. A workers.dev URL would let anyone
# reach the dev API without the Access JWT, so keep it off.
workers_dev = false

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Cloudflare Access team + application AUD tag. Fill in after creating the
# Access application for the hub domain.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[d1_databases]]
binding = "DB"
database_name = "houzs-it-hub"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "houzs-it-hub"

[triggers]
# 02:00 UTC = 10:00 GMT+8. Auto-closes tickets left in Resolved for 7 days.
crons = ["0 2 * * *"]

[observability]
[observability.logs]
enabled = true
